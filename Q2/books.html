<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 4b - Q2: Fetch and Display JSON Data</title>
</head>
<body>
  <main>
    <h1>Book Collection</h1>
    <div id="output" role="status" aria-live="polite">Loading book data...</div>
  </main>

  <script>
    async function loadBooks() {
      const outputContainer = document.getElementById("output");

      try {
        const response = await fetch("books.json");
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }

        const data = await response.json();

        if (!data.books || data.books.length < 2) {
          throw new Error("Invalid JSON structure: expected at least two books.");
        }

        // Clear loading message safely
        outputContainer.textContent = "";

        // (a) Title of the first book
        const firstBookTitle = document.createElement("p");
        firstBookTitle.textContent = `First Book Title: ${data.books[0].title}`;
        outputContainer.appendChild(firstBookTitle);

        // (b) Author of the second book
        const secondBookAuthor = document.createElement("p");
        secondBookAuthor.textContent = `Second Book Author: ${data.books[1].author}`;
        outputContainer.appendChild(secondBookAuthor);

        // (c) Genres of both books, clearly grouped by book title
        const genresHeading = document.createElement("h2");
        genresHeading.textContent = "Genres by Book";
        outputContainer.appendChild(genresHeading);

        const genreList = document.createElement("ul");
        data.books.forEach((book) => {
          const listItem = document.createElement("li");
          listItem.textContent = `${book.title} — ${book.genres.join(", ")}`;
          genreList.appendChild(listItem);
        });
        outputContainer.appendChild(genreList);

      } catch (error) {
        outputContainer.textContent = `Unable to load book data. Please ensure you are running via a local server and books.json is valid. (${error.message})`;
      }
    }

    document.addEventListener("DOMContentLoaded", loadBooks);
  </script>
</body>
</html>
